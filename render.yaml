# Render Blueprint for BudgetTechIndia
# https://render.com/docs/blueprint-spec

services:
  # Web Service - Static Site
  - type: web
    name: budgettechindia
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: redirect
        source: /home
        destination: /
      - type: redirect
        source: /article/:slug
        destination: /blog/:slug
      - type: rewrite
        source: /feed
        destination: /rss.xml
      - type: rewrite
        source: /rss
        destination: /rss.xml
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: SITE_URL
        value: https://budgettechindia.onrender.com/
  # Optional: Redis for caching (if needed in future)
  # - type: redis
  #   name: budgettechindia-cache
  #   ipAllowList: []
  #   plan: free

# Environment Groups
envVarGroups:
  - name: budgettechindia-env
    envVars:
      - key: SITE_NAME
        value: BudgetTechIndia
      - key: SITE_URL
        value: https://budgettechindia.onrender.com/
      - key: NODE_ENV
        value: production

# Previews for pull requests
previews:
  - name: preview
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_ENV
        value: preview
